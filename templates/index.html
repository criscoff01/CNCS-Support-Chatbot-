<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNCS Support Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        header {
            background-color: #1a1a2e;
            color: white;
            padding: 16px 24px;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .website-content {
            padding: 32px 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        .website-content h2 {
            color: #1a1a2e;
            margin-bottom: 12px;
            font-size: 1.25rem;
        }

        .website-content p {
            color: #64748b;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>CyberNet Computer Systems</h1>
    </header>

    <div class="website-content">
        <h2>Welcome to CyberNet Computer Systems (CNCS)</h2>
        <p>The CNCS chatbot is located in the bottom right corner. Click the chat icon to get started!</p>
    </div>

    <!-- Chatbot Widget -->
    <div class="chatbot-wrapper" id="chatbot-wrapper">
        <!-- Launch Button -->
        <button class="chat-launch-button" id="chat-launch-button" aria-label="Open chat">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 6V2H8"/>
                <path d="m8 18-4 4V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2Z"/>
                <path d="M2 12h2"/>
                <path d="M9 11v2"/>
                <path d="M15 11v2"/>
                <path d="M20 12h2"/>
            </svg>
        </button>

        <!-- Chat Container -->
        <div class="chat-container minimized" id="chat-container">
            <div class="chat-header">
                <div class="chat-header-content">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                         stroke-linejoin="round" class="header-icon">
                        <path d="M12 6V2H8"/>
                        <path d="m8 18-4 4V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2Z"/>
                        <path d="M2 12h2"/>
                        <path d="M9 11v2"/>
                        <path d="M15 11v2"/>
                        <path d="M20 12h2"/>
                    </svg>
                    <h3 class="chat-title">CNCS Support Assistant</h3>
                </div>
                <div class="header-buttons">
                    <div class="theme-container">
                        <span class="theme-label">Dark</span>
                        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
                    </div>
                    <button class="chat-toggle" id="chat-minimize-button" aria-label="Minimize chat">−</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Messages rendered dynamically -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
</body>
</html>
